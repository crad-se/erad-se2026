<div class="cron">

  <nav class="cron-tabs" role="tablist">
    <button class="cron-tab active" role="tab" aria-selected="true"  aria-controls="cron-day-0" id="cron-tab-0" tabindex="0"  onclick="cronDay(0,this)">12 ago · Dia 1</button>
    <button class="cron-tab"        role="tab" aria-selected="false" aria-controls="cron-day-1" id="cron-tab-1" tabindex="-1" onclick="cronDay(1,this)">13 ago · Dia 2</button>
    <button class="cron-tab"        role="tab" aria-selected="false" aria-controls="cron-day-2" id="cron-tab-2" tabindex="-1" onclick="cronDay(2,this)">14 ago · Dia 3</button>
  </nav>

  <div id="cron-main"></div>

</div>

<script>
(function () {
  var TYPE = {
    minicurso:  { label:'Minicurso',        color:'var(--c-minicurso)',  bg:'var(--bg-minicurso)'  },
    palestra:   { label:'Palestra',          color:'var(--c-palestra)',   bg:'var(--bg-palestra)'   },
    forum:      { label:'Fórum IC',          color:'var(--c-forum)',      bg:'var(--bg-forum)'      },
    'forum-pos':{ label:'Fórum Pós-Grad',    color:'var(--c-forum-pos)', bg:'var(--bg-forum-pos)'  },
    break:      { label:'Coffee Break',      color:'var(--c-break)',      bg:'var(--bg-break)'      },
    almoco:     { label:'Intervalo',         color:'var(--c-almoco)',     bg:'var(--bg-almoco)'     },
    especial:   { label:'Evento',            color:'var(--c-especial)',   bg:'var(--bg-especial)'   },
    concurso:   { label:'Concurso',          color:'var(--c-concurso)',   bg:'var(--bg-concurso)'   },
    cred:       { label:'Credenciamento',    color:'var(--c-cred)',       bg:'var(--bg-cred)'       },
    maratona:   { label:'Maratona',          color:'var(--c-maratona)',   bg:'var(--bg-maratona)'   },
    reuniao:    { label:'Reunião',           color:'var(--c-reuniao)',    bg:'var(--bg-reuniao)'    },
  };

  var DAYS = [
    [
      { time:'07:30', end:'08:00', type:'cred',     title:'Credenciamento', compact:true },
      { time:'08:00', end:'10:00', type:'minicurso',label:'Minicurso 1',
        title:'Data Science com GPU', part:'parte 1/4', local:'labEngComp' },
      { time:'10:00', end:'10:20', type:'break',    title:'Coffee Break', compact:true },
      { time:'10:20', end:'12:20', type:'minicurso',label:'Minicurso 1',
        title:'Data Science com GPU', part:'parte 2/4', local:'labEngComp' },
      { time:'12:20', end:'14:00', type:'almoco',   title:'Almoço', compact:true },
      { time:'14:00', end:'14:20', type:'especial', title:'Abertura', compact:true, local:'Auditório ICE' },
      { time:'14:20', end:'15:20', type:'palestra', label:'Palestra 1',
        title:'Ciência de Dados para Análise de Desempenho de Aplicações HPC',
        detail:'Prof. Lucas Mello Schnorr (UFRGS)', local:'Auditório ICE' },
      { time:'15:20', end:'16:20', type:'forum',    title:'Fórum de Iniciação Científica',
        part:'Sessão 1', local:'Auditório ICE' },
      { time:'16:20', end:'17:00', type:'break',    title:'Coffee Break', compact:true },
      { time:'17:00', end:'18:00', type:'forum',    title:'Fórum de Iniciação Científica',
        part:'Sessão 2', local:'Auditório ICE' },
      { time:'19:30', end:'21:30', type:'maratona', title:'Maratona de Programação — Warmup' },
    ],
    [
      { time:'07:30', end:'08:00', type:'cred',     title:'Credenciamento', compact:true },
      { time:'08:00', end:'10:00', type:'minicurso',label:'Minicurso 1',
        title:'Data Science com GPU', part:'parte 3/4', local:'labEngComp' },
      { time:'10:00', end:'10:20', type:'break',    title:'Coffee Break', compact:true },
      { time:'10:20', end:'12:20', type:'minicurso',label:'Minicurso 1',
        title:'Data Science com GPU', part:'parte 4/4', local:'labEngComp' },
      { time:'12:20', end:'14:00', type:'almoco',   title:'Almoço', compact:true },
      { time:'14:00', end:'15:00', type:'palestra', label:'Palestra 2',
        title:'Programação Paralela para Aplicações de Bioinformática e Escalonamento de Fluxos de Trabalho na Nuvem: a Corrida por Desempenho',
        detail:'Profa. Alba Cristina Magalhães Alves de Melo (UNB)', local:'Auditório ICE' },
      { time:'15:00', end:'16:00', type:'forum',    title:'Fórum de Iniciação Científica',
        part:'Sessão 3', local:'Auditório ICE' },
      { time:'16:00', end:'16:40', type:'break',    title:'Coffee Break/Sessão de Poster', compact:true },
      { time:'16:40', end:'18:20', type:'concurso', title:'Concurso de TCC', local:'Auditório ICE' },
      { time:'18:40', end:'19:00', type:'reuniao',  title:'Reunião CRAD-SE', compact:true },
      { time:'19:30', end:'22:30', type:'maratona', title:'Maratona de Programação' },
    ],
    [
      { time:'07:30', end:'08:00', type:'cred',     title:'Credenciamento', compact:true },
      { time:'08:00', end:'09:00', type:'palestra', label:'Palestra 3',
        title:'Inteligência, Paralelismo e LLMs',
        detail:'Prof. Wellington Martins (UFG)', local:'Auditório ICE' },
      { time:'09:00', end:'10:00', type:'forum',    title:'Fórum de Iniciação Científica',
        part:'Sessão 4', local:'Auditório ICE' },
      { time:'10:00', end:'10:40', type:'break',    title:'Coffee Break', compact:true },
      { time:'10:40', end:'12:00', type:'forum-pos',title:'Fórum de Pós-Graduação', local:'Auditório ICE' },
      { time:'12:00', end:'14:00', type:'almoco',   title:'Almoço', compact:true },
      { time:'14:00', end:'16:00', type:'minicurso',label:'Minicurso 2',
        title:'OpenMP Tasks: Programação Paralela Baseada em Tarefas',
        part:'parte 1/2', local:'labEngComp' },
      { time:'16:00', end:'16:20', type:'break',    title:'Coffee Break', compact:true },
      { time:'16:20', end:'18:00', type:'minicurso',label:'Minicurso 2',
        title:'OpenMP Tasks: Programação Paralela Baseada em Tarefas',
        part:'parte 2/2', local:'labEngComp' },
      { time:'18:00', end:'18:20', type:'especial', title:'Encerramento', compact:true, local:'Auditório ICE' },
    ],
  ];

  function card(ev) {
    var t = TYPE[ev.type];
    var cls = ev.compact ? ' compact' : '';
    var timeStr = ev.end ? ev.time+'–'+ev.end : ev.time;

    var extras = [];
    if (ev.detail) extras.push('<span class="ev-detail">'+ev.detail+'</span>');
    if (ev.part)   extras.push('<span class="ev-part">'+ev.part+'</span>');
    if (ev.local)  extras.push('<span class="ev-local">'+ev.local+'</span>');

    var body = '';
    if (!ev.compact) body += '<span class="ev-chip">'+(ev.label||t.label)+'</span>';
    body += '<span class="ev-title">'+ev.title+'</span>';
    if (extras.length) {
      body += '<span class="ev-break"></span>';
      body += extras.join('<span class="ev-sep">·</span>');
    }
    return '<article class="ev'+cls+'" style="--ev-color:'+t.color+';--ev-bg:'+t.bg+'">'
      +'<div class="ev-time">'+timeStr+'</div>'
      +'<div class="ev-body">'+body+'</div>'
      +'</article>';
  }

  function renderAll() {
    var main = document.getElementById('cron-main');
    DAYS.forEach(function(events, i) {
      var s = document.createElement('div');
      s.className = 'cron-day' + (i === 0 ? ' visible' : '');
      s.id = 'cron-day-' + i;
      s.setAttribute('role', 'tabpanel');
      s.setAttribute('aria-labelledby', 'cron-tab-' + i);
      s.innerHTML = '<div class="cron-list">'+events.map(card).join('')+'</div>';
      main.appendChild(s);
    });

    var legTypes = [
      ['cred','Credenciamento'],['minicurso','Minicurso'],['palestra','Palestra'],
      ['forum','Fórum IC'],['forum-pos','Fórum Pós-Grad'],['concurso','Concurso de TCC'],
      ['maratona','Maratona'],['reuniao','Reunião'],['especial','Abertura / Encerramento'],
      ['break','Coffee Break'],['almoco','Almoço'],
    ];
    var leg = document.createElement('div');
    leg.className = 'cron-legend';
    leg.innerHTML = '<p class="cron-legend-hd">Legenda</p>' +
      legTypes.map(function(item) {
        var t = TYPE[item[0]];
        return '<span class="cron-legend-item">'
          +'<span class="cron-legend-dot" style="background:'+t.color+'"></span>'
          +item[1]+'</span>';
      }).join('');
    main.appendChild(leg);
  }

  window.cronDay = function(idx, btn) {
    document.querySelectorAll('.cron-day').forEach(function(p, i) {
      p.classList.toggle('visible', i === idx);
    });
    document.querySelectorAll('.cron-tab').forEach(function(b, i) {
      b.classList.toggle('active', i === idx);
      b.setAttribute('aria-selected', i === idx);
      b.tabIndex = i === idx ? 0 : -1;
    });
    if (btn) btn.focus();
  };

  function initTabKeyNav() {
    var tabs = document.querySelectorAll('.cron-tab');
    tabs.forEach(function(tab, i) {
      tab.addEventListener('keydown', function(e) {
        var next;
        if (e.key === 'ArrowRight') next = (i + 1) % tabs.length;
        else if (e.key === 'ArrowLeft') next = (i - 1 + tabs.length) % tabs.length;
        else if (e.key === 'Home') next = 0;
        else if (e.key === 'End') next = tabs.length - 1;
        else return;
        e.preventDefault();
        cronDay(next, tabs[next]);
      });
    });
  }

  renderAll();
  initTabKeyNav();
}());
</script>
